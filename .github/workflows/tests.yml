name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Swift Testing
        runs-on: macos-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Select Xcode Version
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Remove Custom Icon for CI
              run: rm -rf Remnant/Assets.xcassets/RemnantIconCSR.icon

            - name: Run Tests (macOS)
              run: |
                  xcodebuild test \
                    -scheme Remnant \
                    -destination 'platform=macOS' \
                    -configuration Debug \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    MACOSX_DEPLOYMENT_TARGET=27.0 \
                    ENABLE_PREVIEWS=NO \
                    | xcbeautify

            - name: Run Tests (iOS Simulator)
              run: |
                  xcodebuild test \
                    -scheme Remnant \
                    -destination 'platform=iOS Simulator,name=iPhone 16,OS=27.0' \
                    -configuration Debug \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    IPHONEOS_DEPLOYMENT_TARGET=27.0 \
                    ENABLE_PREVIEWS=NO \
                    | xcbeautify
