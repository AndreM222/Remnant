name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint & Format
        runs-on: macos-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Select Xcode Version
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Install Dependencies
              run: brew install swiftlint swiftformat

            - name: SwiftLint
              run: swiftlint

            - name: SwiftFormat
              run: swiftformat . --lint

    typos:
        name: Spell Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Check Typos
              uses: crate-ci/typos@v1.51.1
              with:
                  config: typos.toml

    commitlint:
        name: Commit Messages
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate Commit Messages
              uses: wagoid/commitlint-github-action@v6
              with:
                  configFile: commitlint.config.mjs

    build:
        name: Build
        runs-on: macos-latest
        needs: [lint, typos, commitlint]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Select Xcode Version
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Install Dependencies
              run: brew install xcbeautify

            - name: Remove Custom Icon for CI
              run: |
                  rm -rf Noir/Assets.xcassets/NoirIconCSR.icon
                  rm -rf Noir/NoirIconCSR.icon

            - name: Build (macOS)
              run: |
                  set -o pipefail
                  xcodebuild \
                    -scheme Noir \
                    -destination 'platform=macOS' \
                    -configuration Debug \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    MACOSX_DEPLOYMENT_TARGET=27.0 \
                    ENABLE_PREVIEWS=NO \
                    SKIP_INSTALL=YES \
                    build | xcbeautify
