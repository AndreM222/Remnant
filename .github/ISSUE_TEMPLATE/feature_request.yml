name: Feature Request
description: Suggest an idea for Remnant
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature for Remnant.
        Please fill out the form below as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
      placeholder: I would like Remnant to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any alternative solutions or features you've considered.
      placeholder: I also considered...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Product Area
      description: Which area of Remnant does this relate to?
      options:
        - Search & Discovery
        - Playback & Launch
        - Device Continuity
        - Theater Integration
        - Social Features
        - Account & Profiles
        - Settings & Shortcuts
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, or examples.
    validations:
      required: false
