name: Bug Report
description: Report a bug or unexpected behaviour in Remnant
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Remnant.
        Please fill out the form below as clearly as possible so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Step by step instructions to reproduce the bug.
      placeholder: |
        1. Open Remnant
        2. Navigate to...
        3. Click on...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product Area
      description: Which area of Remnant does this bug relate to?
      options:
        - Search & Discovery
        - Playback & Launch
        - Device Continuity
        - Theater Integration
        - Social Features
        - Account & Profiles
        - Settings & Shortcuts
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you experience the bug?
      multiple: true
      options:
        - macOS
        - iOS
        - watchOS
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS Version
      description: What version of macOS or iOS are you running?
      placeholder: e.g. macOS 26.4, iOS 26.5
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Remnant Version
      description: What version of Remnant are you using?
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly does this affect your experience?
      options:
        - Critical — app crashes or data is lost
        - High — feature is broken and unusable
        - Medium — feature works but behaves incorrectly
        - Low — minor visual or cosmetic issue
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or any other relevant information.
    validations:
      required: false
